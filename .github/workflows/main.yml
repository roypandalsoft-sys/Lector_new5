name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Detectar carpeta del proyecto Android
        id: project
        shell: bash
        run: |
          SETTINGS_FILE="$(find . -maxdepth 4 \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: No se encontró settings.gradle ni settings.gradle.kts"
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Proyecto encontrado en: $PROJECT_DIR"

      - name: Compilar APK Debug
        run: gradle -p "${{ steps.project.outputs.project_dir }}" assembleDebug

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: LectorNotificaciones-YapeSeguro-APK
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
